on:
  release:
    types:
      - published
  
jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        target_type:
          - server
          - client
    steps:

      - name: Resolve version
        shell: bash
        run: echo "MOD_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7

      # The audio samples and item icons are GPL-3.0 assets of the original Java
      # mod, so they are fetched at build time instead of being vendored here.
      - name: Fetch upstream assets
        shell: pwsh
        run: git clone --depth 1 https://github.com/StavWasPlayZ/Genshin-Instruments.git upstream

      - name: Generate packs
        shell: pwsh
        run: python tools/build_packs.py upstream

      - uses: xmake-io/github-action-setup-xmake@v1
        # with:
        #   xmake-version: branch@master

      - uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/.xmake
          key: xmake-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            xmake-

      - name: Setup LLVM
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 22

      - run: |
          xmake repo -u

      - run: |
          xmake f -a x64 -m release -p windows --target_type=${{ matrix.target_type }} -y

      - run: |
          xmake -w -y

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-${{ matrix.target_type }}-windows-x64
          path: |
            bin/

  update-release-notes:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: extract-release-notes
        uses: ffurrer2/extract-release-notes@v3

      - uses: softprops/action-gh-release@v3
        with:
          body: |
            ${{ steps.extract-release-notes.outputs.release_notes }}

  upload-to-release:
    needs:
      - build
      - update-release-notes
    permissions:
      contents: write
    strategy:
      matrix:
        target_type:
          - server
          - client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-${{ matrix.target_type }}-windows-x64
          path: artifact

      - run: |
          cp CHANGELOG.md LICENSE README.md artifact/

      # The launcher validates a mod archive by taking the FIRST manifest.json it
      # meets as the mod manifest; the resource pack inside packs/ also has one.
      # So the mod manifest must be written before anything else.
      - run: |
          set -euo pipefail
          out="../${{ github.event.repository.name }}-${{ matrix.target_type }}-windows-x64.zip"
          rm -f "$out"
          zip -X "$out" genshin-instruments/manifest.json
          zip -rX "$out" genshin-instruments -x 'genshin-instruments/manifest.json'
          zip -X "$out" README.md LICENSE CHANGELOG.md
        working-directory: artifact

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ github.event.repository.name }}-${{ matrix.target_type }}-windows-x64.zip
