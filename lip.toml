format = 4
id = "github.com/MOJANG-dream/Genshin-Instruments-bedrock"
version = "0.1.4"

[info]
name = "Genshin Instruments"
description = "Play the instruments of Genshin Impact in Bedrock: Windsong Lyre, Floral Zither, Vintage Lyre, Arataki's Great and Glorious Drum, Nightwind Horn, Ukulele and Djem Djem Drum."
tags = ["platform:levilamina", "type:mod"]

# The default variant has an entry for each side: the server build for servers and the
# client build for clients, so the mod is installed as "<id>" on either side.

[[variants."" ]]
side = "server"
platform = "win-x64"

[variants."".deps]
"github.com/LiteLDev/LeviLamina" = "26.60.*"

[[variants."".assets]]
type = "zip"
urls = ["https://{{id}}/releases/download/v{{version}}/Genshin-Instruments-bedrock-server-windows-x64.zip"]
place = [{ src = "genshin-instruments/", dest = "mods/genshin-instruments/" }]

[[variants."" ]]
side = "client"
platform = "win-x64"

[variants."".deps]
"github.com/LiteLDev/LeviLamina" = ">26.60.6 <26.61.0"

[[variants."".assets]]
type = "zip"
urls = ["https://{{id}}/releases/download/v{{version}}/Genshin-Instruments-bedrock-client-windows-x64.zip"]
place = [{ src = "genshin-instruments/", dest = "mods/genshin-instruments/" }]
